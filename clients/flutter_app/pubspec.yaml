name: wuwei_app
description: 无维AI - 面向中老年的方言语音聊天助手
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  dio: ^5.4.0
  web_socket_channel: ^3.0.0
  # record: ^5.1.0  # TODO: 手机调试时启用
  # just_audio: ^0.9.37  # TODO: 手机调试时启用
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.2.0
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.0
  go_router: ^14.2.0
  flutter_animate: ^4.5.0
  json_annotation: ^4.9.0
  uuid: ^4.3.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.7.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
