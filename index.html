<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无维</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@300;400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: oklch(9% 0.008 240);
    --bg2: oklch(12% 0.01 240);
    --fg: oklch(92% 0.01 80);
    --fg-dim: oklch(55% 0.008 80);
    --accent: oklch(68% 0.12 155);
    --accent-glow: oklch(68% 0.12 155 / 0.25);
    --red: oklch(65% 0.15 20);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  #root { height: 100%; }

  @keyframes pulse-ring {
    0%   { transform: scale(1);   opacity: 0.6; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  @keyframes pulse-ring2 {
    0%   { transform: scale(1);   opacity: 0.4; }
    100% { transform: scale(2.1); opacity: 0; }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.04); }
  }
  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }
  @keyframes wave {
    0%, 100% { height: 6px; }
    50%       { height: 28px; }
  }
  @keyframes thinking-dot {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40%            { opacity: 1;   transform: scale(1.2); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "155",
  "fontSize": 52,
  "theme": "dark"
}/*EDITMODE-END*/;

// ── Waveform bars shown while listening ────────────────────────────────────
function WaveForm() {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 4, height: 36 }}>
      {Array.from({length: 7}).map((_, i) => (
        <div key={i} style={{
          width: 3, borderRadius: 2,
          background: 'var(--accent)',
          animation: `wave 0.9s ease-in-out infinite`,
          animationDelay: `${i * 0.1}s`,
          height: 6,
        }} />
      ))}
    </div>
  );
}

// ── Thinking dots ──────────────────────────────────────────────────────────
function ThinkingDots() {
  return (
    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
      {[0, 1, 2].map(i => (
        <div key={i} style={{
          width: 8, height: 8, borderRadius: '50%',
          background: 'var(--fg-dim)',
          animation: `thinking-dot 1.4s ease-in-out infinite`,
          animationDelay: `${i * 0.2}s`,
        }} />
      ))}
    </div>
  );
}

// ── Typewriter text ────────────────────────────────────────────────────────
function TypewriterText({ text, fontSize }) {
  const [displayed, setDisplayed] = useState('');
  const idx = useRef(0);

  useEffect(() => {
    setDisplayed('');
    idx.current = 0;
    if (!text) return;
    const interval = setInterval(() => {
      idx.current++;
      setDisplayed(text.slice(0, idx.current));
      if (idx.current >= text.length) clearInterval(interval);
    }, 28);
    return () => clearInterval(interval);
  }, [text]);

  return (
    <span style={{ fontFamily: "'Cormorant Garamond', 'Noto Serif SC', serif" }}>
      {displayed}
      {displayed.length < text.length && (
        <span style={{
          display: 'inline-block', width: 2, height: fontSize * 0.85,
          background: 'var(--accent)', marginLeft: 4, verticalAlign: 'middle',
          animation: 'blink 0.8s step-end infinite',
        }} />
      )}
    </span>
  );
}

// ── Voice button ───────────────────────────────────────────────────────────
function VoiceButton({ state, onPress, onRelease }) {
  const isListening = state === 'listening';
  const isThinking  = state === 'thinking';
  const isIdle      = state === 'idle';

  return (
    <div style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

      {/* Pulse rings — only while listening */}
      {isListening && <>
        <div style={{
          position: 'absolute', width: 96, height: 96, borderRadius: '50%',
          border: '1.5px solid var(--accent)',
          animation: 'pulse-ring 1.4s ease-out infinite',
        }} />
        <div style={{
          position: 'absolute', width: 96, height: 96, borderRadius: '50%',
          border: '1.5px solid var(--accent)',
          animation: 'pulse-ring2 1.4s ease-out infinite 0.4s',
        }} />
      </>}

      {/* Thinking ring */}
      {isThinking && (
        <div style={{
          position: 'absolute', width: 104, height: 104, borderRadius: '50%',
          border: '1.5px solid transparent',
          borderTopColor: 'var(--accent)',
          borderRightColor: 'var(--accent)',
          animation: 'spin-slow 1.2s linear infinite',
        }} />
      )}

      {/* Main button */}
      <button
        onMouseDown={onPress}
        onMouseUp={onRelease}
        onTouchStart={onPress}
        onTouchEnd={onRelease}
        style={{
          position: 'relative', zIndex: 2,
          width: 88, height: 88, borderRadius: '50%', border: 'none', cursor: 'pointer',
          background: isListening
            ? 'var(--accent)'
            : isThinking
            ? 'var(--bg2)'
            : 'var(--bg2)',
          boxShadow: isListening
            ? `0 0 0 0 var(--accent-glow), 0 8px 32px oklch(0% 0 0 / 0.5)`
            : `0 2px 20px oklch(0% 0 0 / 0.4)`,
          outline: isIdle ? '1px solid oklch(30% 0.01 240)' : `1.5px solid var(--accent)`,
          outlineOffset: 2,
          transition: 'background 0.3s, box-shadow 0.3s, outline 0.3s',
          animation: isIdle ? 'breathe 4s ease-in-out infinite' : 'none',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          WebkitTapHighlightColor: 'transparent',
        }}
      >
        {isListening ? (
          <WaveForm />
        ) : isThinking ? (
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--fg-dim)" strokeWidth="1.5" strokeLinecap="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 3" />
          </svg>
        ) : (
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--fg-dim)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 10a7 7 0 0 0 14 0" />
            <line x1="12" y1="19" x2="12" y2="22" />
            <line x1="9"  y1="22" x2="15" y2="22" />
          </svg>
        )}
      </button>
    </div>
  );
}

// ── Input bar ──────────────────────────────────────────────────────────────
function InputBar({ onSend, disabled }) {
  const [val, setVal] = useState('');
  const send = () => {
    if (!val.trim() || disabled) return;
    onSend(val.trim());
    setVal('');
  };
  return (
    <div style={{ display: 'flex', gap: 8, alignItems: 'center', width: '100%' }}>
      <input
        value={val}
        onChange={e => setVal(e.target.value)}
        onKeyDown={e => e.key === 'Enter' && send()}
        placeholder="或者直接输入…"
        disabled={disabled}
        style={{
          flex: 1, background: 'oklch(14% 0.008 240)', border: '1px solid oklch(22% 0.01 240)',
          borderRadius: 12, color: 'var(--fg)', fontFamily: 'inherit', fontSize: 14,
          padding: '10px 16px', outline: 'none',
          transition: 'border-color 0.2s',
          opacity: disabled ? 0.5 : 1,
        }}
        onFocus={e => e.target.style.borderColor = 'var(--accent)'}
        onBlur={e => e.target.style.borderColor = 'oklch(22% 0.01 240)'}
      />
      <button
        onClick={send}
        disabled={!val.trim() || disabled}
        style={{
          background: 'none', border: '1px solid oklch(22% 0.01 240)',
          borderRadius: 12, color: val.trim() && !disabled ? 'var(--accent)' : 'var(--fg-dim)',
          padding: '10px 16px', cursor: 'pointer', fontSize: 13, fontFamily: 'inherit',
          transition: 'color 0.2s, border-color 0.2s',
          borderColor: val.trim() && !disabled ? 'var(--accent)' : undefined,
        }}
      >
        发送
      </button>
    </div>
  );
}

// ── History chip ───────────────────────────────────────────────────────────
function HistoryChip({ text, onClick }) {
  const [hov, setHov] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setHov(true)}
      onMouseLeave={() => setHov(false)}
      style={{
        background: hov ? 'oklch(16% 0.01 240)' : 'none',
        border: '1px solid oklch(20% 0.01 240)',
        borderRadius: 20, color: 'var(--fg-dim)', padding: '4px 12px',
        fontSize: 12, cursor: 'pointer', fontFamily: 'inherit',
        whiteSpace: 'nowrap', maxWidth: 200, overflow: 'hidden', textOverflow: 'ellipsis',
        transition: 'background 0.15s',
      }}
    >{text}</button>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────
function App() {
  const [state, setState]         = useState('idle'); // idle | listening | thinking | responding
  const [response, setResponse]   = useState('');
  const [question, setQuestion]   = useState('');
  const [history, setHistory]     = useState([]);
  const holdTimer = useRef(null);
  const recognitionRef = useRef(null);

  // Web Speech API setup
  const startListening = useCallback(() => {
    if (state !== 'idle') return;
    setState('listening');
    setResponse('');
    setQuestion('');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const rec = new SpeechRecognition();
      rec.lang = 'zh-CN';
      rec.interimResults = true;
      rec.onresult = (e) => {
        const transcript = [...e.results].map(r => r[0].transcript).join('');
        setQuestion(transcript);
      };
      rec.onend = () => { /* handled by stopListening */ };
      rec.start();
      recognitionRef.current = rec;
    }
  }, [state]);

  const stopListening = useCallback(async () => {
    if (state !== 'listening') return;

    if (recognitionRef.current) {
      recognitionRef.current.stop();
      recognitionRef.current = null;
    }

    setState('thinking');

    // Get current question from state via ref trick
    const q = await new Promise(resolve => {
      setQuestion(prev => { resolve(prev); return prev; });
    });

    if (!q.trim()) {
      setState('idle');
      return;
    }
    await sendToAI(q);
  }, [state]);

  const sendToAI = async (q) => {
    setState('thinking');
    setQuestion(q);
    try {
      const text = await window.claude.complete({
        messages: [{ role: 'user', content: q }],
      });
      setState('responding');
      setResponse(text);
      setHistory(h => [{ q, a: text }, ...h].slice(0, 5));
    } catch(e) {
      setState('responding');
      setResponse('抱歉，出现了一些问题。请再试一次。');
    }
  };

  const handleTextSend = async (q) => {
    setResponse('');
    await sendToAI(q);
  };

  const handleDone = () => setState('idle');

  // Keyboard shortcut: Space to hold
  useEffect(() => {
    const down = (e) => { if (e.code === 'Space' && state === 'idle') { e.preventDefault(); startListening(); } };
    const up   = (e) => { if (e.code === 'Space' && state === 'listening') { e.preventDefault(); stopListening(); } };
    window.addEventListener('keydown', down);
    window.addEventListener('keyup', up);
    return () => { window.removeEventListener('keydown', down); window.removeEventListener('keyup', up); };
  }, [state, startListening, stopListening]);

  const fontSize = 52;

  return (
    <div style={{
      height: '100vh', display: 'grid',
      gridTemplateRows: '1fr auto auto',
      gridTemplateColumns: '1fr',
      padding: '48px 40px 36px',
      gap: 0,
    }}>

      {/* ── Response area ── */}
      <div style={{
        display: 'flex', flexDirection: 'column',
        justifyContent: 'center', alignItems: 'center',
        padding: '0 40px',
        minHeight: 0,
      }}>
        {state === 'idle' && !response && (
          <div style={{
            textAlign: 'center',
            animation: 'fade-up 0.8s ease both',
          }}>
            <div style={{
              fontSize: 13, color: 'var(--fg-dim)', letterSpacing: '0.2em',
              textTransform: 'uppercase', marginBottom: 12,
              fontFamily: 'DM Sans, sans-serif',
            }}>无维</div>
            <div style={{
              fontSize: 18, color: 'oklch(35% 0.008 240)',
              fontFamily: "'Cormorant Garamond', serif",
              fontStyle: 'italic', fontWeight: 300,
            }}>按住说话，或输入问题</div>
          </div>
        )}

        {state === 'listening' && (
          <div style={{ textAlign: 'center', animation: 'fade-up 0.3s ease both' }}>
            {question ? (
              <div style={{
                fontSize: 28,
                fontFamily: "'Cormorant Garamond', 'Noto Serif SC', serif",
                color: 'var(--fg-dim)', fontWeight: 300, lineHeight: 1.5,
                maxWidth: 680, textWrap: 'pretty',
              }}>「{question}」</div>
            ) : (
              <div style={{ color: 'var(--fg-dim)', fontSize: 15, letterSpacing: '0.1em' }}>
                正在聆听…
              </div>
            )}
          </div>
        )}

        {state === 'thinking' && (
          <div style={{
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24,
            animation: 'fade-up 0.3s ease both',
          }}>
            {question && (
              <div style={{
                fontSize: 16, color: 'oklch(40% 0.008 240)',
                fontFamily: "'Cormorant Garamond', serif", fontStyle: 'italic',
              }}>「{question}」</div>
            )}
            <ThinkingDots />
          </div>
        )}

        {(state === 'responding' || (state === 'idle' && response)) && response && (
          <div style={{
            animation: 'fade-up 0.5s ease both',
            textAlign: 'center', maxWidth: 800,
          }}>
            <div style={{
              fontSize: fontSize, lineHeight: 1.45, fontWeight: 300,
              textWrap: 'pretty', letterSpacing: '-0.01em',
            }}>
              <TypewriterText text={response} fontSize={fontSize} />
            </div>
            {state === 'responding' && response.length > 0 && (
              <div style={{ marginTop: 32 }}>
                <button
                  onClick={handleDone}
                  style={{
                    background: 'none', border: '1px solid oklch(25% 0.01 240)',
                    borderRadius: 20, color: 'var(--fg-dim)', padding: '6px 20px',
                    fontSize: 12, cursor: 'pointer', fontFamily: 'inherit',
                    letterSpacing: '0.1em',
                    transition: 'border-color 0.2s, color 0.2s',
                  }}
                  onMouseEnter={e => { e.target.style.borderColor='var(--accent)'; e.target.style.color='var(--accent)'; }}
                  onMouseLeave={e => { e.target.style.borderColor='oklch(25% 0.01 240)'; e.target.style.color='var(--fg-dim)'; }}
                >完成</button>
              </div>
            )}
          </div>
        )}
      </div>

      {/* ── Voice button row ── */}
      <div style={{
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20,
        paddingBottom: 28,
      }}>
        <VoiceButton
          state={state === 'responding' ? 'idle' : state}
          onPress={startListening}
          onRelease={stopListening}
        />
        <div style={{
          fontSize: 11, color: 'oklch(30% 0.008 240)',
          letterSpacing: '0.15em', textTransform: 'uppercase',
        }}>
          {state === 'idle' && '按住说话'}
          {state === 'listening' && '松开发送'}
          {state === 'thinking' && '思考中'}
          {state === 'responding' && ''}
        </div>
      </div>

      {/* ── Bottom bar ── */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 12,
        borderTop: '1px solid oklch(16% 0.008 240)', paddingTop: 20,
      }}>
        {/* History chips */}
        {history.length > 0 && (
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', justifyContent: 'center' }}>
            {history.map((item, i) => (
              <HistoryChip
                key={i}
                text={item.q}
                onClick={() => {
                  setState('idle');
                  setResponse(item.a);
                  setQuestion(item.q);
                }}
              />
            ))}
          </div>
        )}
        <InputBar onSend={handleTextSend} disabled={state === 'thinking' || state === 'listening'} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
